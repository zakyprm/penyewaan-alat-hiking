# PostgreSQL untuk pengembangan lokal.
# Jalankan: docker compose up -d    | Hentikan: docker compose down
# Kredensial di bawah hanya untuk lokal. Production memakai Neon.
services:
  db:
    image: postgres:18-alpine
    container_name: sewa-hiking-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sewa_hiking
      TZ: UTC
    ports:
      # Hanya bisa diakses dari komputer ini
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 menyimpan data di /var/lib/postgresql/<versi>/docker
      - pgdata:/var/lib/postgresql
      # Membuat database kedua (sewa_hiking_test) untuk integration test
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sewa_hiking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
